version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mindcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mindcare_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mindcare_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mindcare_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mindcare_user} -d ${POSTGRES_DB:-mindcare_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: mindcare-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-mindcare_user}:${POSTGRES_PASSWORD:-mindcare_dev_password}@postgres:5432/${POSTGRES_DB:-mindcare_dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-insecure-key-do-not-use-in-production}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
